<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bible Cross-Reference Explorer</title>
    <meta name="description" content="See how verses connect across the whole Bible through 340,000 cross-references." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;700&family=IM+Fell+English&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&display=swap"
    />
    <script>
      // Apply a saved theme before first paint to avoid a flash of the wrong theme.
      try {
        const t = localStorage.getItem('theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <a class="skip-link" href="#app">Skip to content</a>
    <header class="site-header">
      <a class="site-title" href="#/">Bible Cross-Reference Explorer</a>
      <nav class="site-nav" aria-label="Views">
        <a href="#/verse/John.3.16" data-view="verse">Verse</a>
        <a href="#/arcs" data-view="arcs">Arcs</a>
        <a href="#/books" data-view="books">Books</a>
        <a href="#/about" data-view="about">About</a>
      </nav>
      <form class="site-search" role="search" autocomplete="off">
        <label class="visually-hidden" for="search-input">Go to a verse</label>
        <input
          id="search-input"
          type="search"
          placeholder="Go to a verse, e.g. John 3:16"
          role="combobox"
          aria-autocomplete="list"
          aria-expanded="false"
          aria-controls="search-options"
          enterkeyhint="go"
          spellcheck="false"
        />
        <ul id="search-options" role="listbox" aria-label="Books" hidden></ul>
        <p class="search-message" role="status"></p>
      </form>
      <!-- The label names the theme the button switches to. CSS shows the right half
           from the first paint, and only the visible half counts as the button's name. -->
      <button class="theme-toggle" type="button">
        <span class="to-dark" title="Switch to dark theme">
          <svg class="theme-icon" viewBox="0 0 16 16" aria-hidden="true">
            <path d="M13.5 9.6A5.6 5.6 0 0 1 6.4 2.5a5.6 5.6 0 1 0 7.1 7.1Z" />
          </svg>
          <span class="theme-label">Switch to dark<span class="visually-hidden"> theme</span></span>
        </span>
        <span class="to-light" title="Switch to light theme">
          <svg class="theme-icon" viewBox="0 0 16 16" aria-hidden="true">
            <circle cx="8" cy="8" r="3" />
            <path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1" />
          </svg>
          <span class="theme-label">Switch to light<span class="visually-hidden"> theme</span></span>
        </span>
      </button>
      <p class="visually-hidden theme-status" role="status"></p>
    </header>
    <main id="app" tabindex="-1"></main>
    <footer class="site-footer">
      <!-- One line: the data credit (required by CC BY) and About, which has the full credits. -->
      <p>
        <span>Cross-references: <a href="https://www.openbible.info/labs/cross-references/">OpenBible.info</a>,
          <a href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a></span>
        <span aria-hidden="true">·</span>
        <a href="#/about">About</a>
      </p>
    </footer>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
